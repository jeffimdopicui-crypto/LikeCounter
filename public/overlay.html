<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Like Counter</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- LIKE ESQUERDA -->

    <img 
        src="like.png" 
        class="like"
    >




    <!-- TEXTO CENTRAL -->

    <div class="textos">


        <div class="titulo">
            DEIXE O LIKE!
        </div>



        <div class="contador">


            <div class="numeros">


                <span id="likes">
                    0
                </span>


                <span class="separador">
                    /
                </span>


                <span id="meta">
                    10
                </span>


            </div>




            <div class="barra-container">


                <div 
                    id="barra" 
                    class="barra">
                </div>


            </div>



        </div>


    </div>





    <!-- AVATAR DIREITA -->

    <img 
        src="avatar.png" 
        class="avatar"
    >



</div>



<script src="config.js"></script>

<script src="script.js"></script>


</body>

</html>
