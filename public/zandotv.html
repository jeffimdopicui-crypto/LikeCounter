<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZandoTv Overlay</title>

<style>
:root{
    --red:#ff1738;
    --red2:#ff3d55;
    --white:#ffffff;
    --panel:rgba(3,5,9,.88);
}

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:transparent;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================================================
   BANNER FIXO
   O FUNDO NUNCA MUDA. SÓ O CONTEÚDO INTERNO É ANIMADO.
========================================================= */

.banner{
    position:relative;
    width:900px;
    height:118px;
    overflow:hidden;

    background:
        linear-gradient(180deg,rgba(8,10,15,.96),rgba(1,2,5,.96));

    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55),
        0 0 35px rgba(255,0,35,.08),
        inset 0 1px 0 rgba(255,255,255,.06);

    isolation:isolate;
}

/* brilho vermelho fixo na lateral */
.banner::before{
    content:"";
    position:absolute;
    z-index:1;
    left:0;
    top:0;
    width:4px;
    height:100%;

    background:linear-gradient(
        180deg,
        transparent,
        var(--red),
        #ff7180,
        var(--red),
        transparent
    );

    box-shadow:
        0 0 12px var(--red),
        0 0 30px rgba(255,0,35,.55);
}

/* linha premium superior */
.banner::after{
    content:"";
    position:absolute;
    z-index:3;
    left:30px;
    right:30px;
    top:0;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        rgba(255,23,56,.75),
        rgba(255,255,255,.35),
        transparent
    );
}

/* =========================================================
   FUNDO FIXO
========================================================= */

.background{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.10;
    background:var(--red);
}

.glow.left{
    left:-220px;
    top:-150px;
}

.glow.right{
    right:-220px;
    bottom:-180px;
}

.lines{
    position:absolute;
    inset:-100px;

    background:
        linear-gradient(
            135deg,
            transparent 0 47%,
            rgba(255,23,56,.09) 48%,
            transparent 49% 100%
        );

    background-size:170px 170px;
    opacity:.35;
}

.scan{
    position:absolute;
    top:0;
    bottom:0;
    width:120px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.035),
        transparent
    );

    transform:skewX(-18deg);
    animation:scan 5s linear infinite;
}

/* pequenos pontos fixos */
.dots{
    position:absolute;
    right:26px;
    top:16px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        11px 0 rgba(255,23,56,.8),
        22px 0 rgba(255,255,255,.25),
        33px 0 rgba(255,23,56,.45);
}

/* =========================================================
   MOLDURA INTERNA
========================================================= */

.inner{
    position:absolute;
    z-index:4;
    inset:9px 12px;

    border:1px solid rgba(255,255,255,.055);
    border-radius:9px;

    pointer-events:none;
}

/* detalhes laterais fixos */
.corner{
    position:absolute;
    width:22px;
    height:22px;
    z-index:5;
}

.corner.tl{
    left:15px;
    top:14px;
    border-left:2px solid var(--red);
    border-top:2px solid var(--red);
}

.corner.br{
    right:15px;
    bottom:14px;
    border-right:2px solid var(--red);
    border-bottom:2px solid var(--red);
}

/* =========================================================
   ÁREA ONDE O CONTEÚDO TROCA
========================================================= */

.content{
    position:absolute;
    z-index:10;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* cada cena ocupa exatamente o mesmo espaço */
.scene{
    position:absolute;
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    transform:translateY(8px) scale(.985);

    animation-duration:8s;
    animation-iteration-count:infinite;
    animation-timing-function:cubic-bezier(.22,.8,.25,1);
}

/* =========================================================
   CENA 1
========================================================= */

.scene-live{
    animation-name:sceneLive;
}

.live-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}

.live-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--red);

    box-shadow:
        0 0 7px var(--red),
        0 0 18px rgba(255,23,56,.8);

    animation:pulse 1.1s ease-in-out infinite;
}

.live-label{
    color:rgba(255,255,255,.55);
    font-size:12px;
    font-weight:800;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:5px;
}

.live-title{
    color:#fff;
    font-size:31px;
    font-weight:950;
    letter-spacing:1.5px;
    text-transform:uppercase;

    text-shadow:
        0 2px 14px rgba(0,0,0,.9);
}

.live-title strong{
    color:var(--red);
    text-shadow:
        0 0 10px rgba(255,23,56,.45);
}

/* =========================================================
   TRANSIÇÃO
========================================================= */

.transition{
    position:absolute;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    animation:transition 8s infinite;
}

.arrow{
    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,23,56,.55);
    border-radius:50%;

    background:rgba(255,23,56,.07);

    color:#fff;
    font-size:28px;
    font-weight:900;

    box-shadow:
        0 0 18px rgba(255,23,56,.3),
        inset 0 0 18px rgba(255,23,56,.08);
}

/* =========================================================
   CENA 2
========================================================= */

.scene-youtube{
    animation-name:sceneYoutube;
}

.youtube-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.youtube{
    position:relative;
    width:57px;
    height:40px;

    border-radius:11px;
    background:linear-gradient(
        145deg,
        #ff5265,
        #ff1738 45%,
        #d90020
    );

    box-shadow:
        0 0 12px rgba(255,23,56,.55),
        0 0 30px rgba(255,23,56,.20),
        inset 0 1px 2px rgba(255,255,255,.35);
}

.youtube::after{
    content:"";
    position:absolute;
    left:23px;
    top:10px;

    width:0;
    height:0;

    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
    border-left:16px solid #fff;

    filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}

.handle{
    color:#fff;
    font-size:34px;
    font-weight:950;
    letter-spacing:2px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.8);
}

.handle .at{
    color:var(--red);
    text-shadow:
        0 0 12px rgba(255,23,56,.45);
}

/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes sceneLive{
    0%,7%{
        opacity:0;
        transform:translateY(10px) scale(.97);
    }

    13%,42%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    48%,100%{
        opacity:0;
        transform:translateY(-8px) scale(1.02);
    }
}

@keyframes sceneYoutube{
    0%,50%{
        opacity:0;
        transform:translateY(10px) scale(.97);
    }

    56%,88%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    95%,100%{
        opacity:0;
        transform:translateY(-8px) scale(1.02);
    }
}

@keyframes scan{
    from{
        left:-180px;
    }
    to{
        left:980px;
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }
    50%{
        transform:scale(.7);
        opacity:.55;
    }
}

/* =========================================================
   REDUÇÃO AUTOMÁTICA PARA TELAS MENORES
========================================================= */

@media(max-width:920px){
    .banner{
        transform:scale(.82);
    }
}
</style>
</head>

<body>

<div class="banner">

    <!-- FUNDO FIXO -->
    <div class="background">
        <div class="glow left"></div>
        <div class="glow right"></div>
        <div class="lines"></div>
        <div class="scan"></div>
        <div class="dots"></div>
    </div>

    <!-- MOLDURA FIXA -->
    <div class="inner"></div>
    <div class="corner tl"></div>
    <div class="corner br"></div>

    <!-- CONTEÚDO QUE MUDA -->
    <div class="content">

        <!-- CENA 1 -->
        <div class="scene scene-live">
            <div class="live-wrap">
                <div class="live-dot"></div>

                <div>
                    <div class="live-label">ZANDO TV • AO VIVO</div>

                    <div class="live-title">
                        LIVE EM <strong>TELA CHEIA</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENA 2 -->
        <div class="scene scene-youtube">
            <div class="youtube-wrap">

                <div class="youtube"></div>

                <div class="handle">
                    <span class="at">/</span>ZANDO TV
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
