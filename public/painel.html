<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Painel Like Counter</title>


<style>


*{
    box-sizing:border-box;
}



body{


    margin:0;

    height:100vh;


    display:flex;

    justify-content:center;

    align-items:center;



    background:


    radial-gradient(
        circle at top,
        #16294d,
        #05070c 65%
    );



    font-family:

    Arial,
    sans-serif;



    color:white;


}




.box{


    width:430px;


    padding:35px;



    border-radius:25px;



    background:


    linear-gradient(
        145deg,
        rgba(25,35,60,.95),
        rgba(5,8,18,.96)
    );



    border:

    1px solid rgba(0,234,255,.25);



    box-shadow:


    0 0 35px rgba(0,110,255,.45),

    inset 0 0 35px rgba(255,255,255,.04);



    backdrop-filter:blur(15px);



    position:relative;


    overflow:hidden;


}





/* luz passando no card */


.box::before{


    content:"";


    position:absolute;


    top:0;


    left:-100%;


    width:70%;


    height:100%;



    background:


    linear-gradient(

        120deg,

        transparent,

        rgba(255,255,255,.15),

        transparent

    );



    animation:


    brilho 5s infinite;



}




@keyframes brilho{


    0%{

        left:-100%;

    }


    50%{

        left:130%;

    }


    100%{

        left:130%;

    }


}





h2{


    text-align:center;


    margin:0;



    font-size:28px;


    letter-spacing:2px;



    text-shadow:


    0 0 15px #00eaff;



}



.subtitulo{


    text-align:center;


    color:#aaa;


    margin-top:8px;


    margin-bottom:25px;


}





input{


    width:100%;


    padding:15px;


    margin-top:15px;



    background:


    rgba(0,0,0,.45);



    border:


    1px solid rgba(255,255,255,.15);



    border-radius:12px;



    color:white;



    font-size:16px;



    outline:none;



}



input::placeholder{

    color:#777;

}



input:focus{


    border-color:#00eaff;



    box-shadow:


    0 0 15px rgba(0,234,255,.4);


}







button{


    width:100%;



    margin-top:18px;



    padding:15px;



    border-radius:12px;



    border:0;



    cursor:pointer;



    color:white;



    font-size:17px;



    font-weight:bold;



    background:


    linear-gradient(

        90deg,

        #006eff,

        #00eaff

    );



    box-shadow:


    0 0 20px rgba(0,234,255,.5);



    transition:.3s;



}



button:hover{


    transform:scale(1.03);



    box-shadow:


    0 0 35px #00eaff;



}







#status{


    margin-top:25px;



    padding:18px;



    border-radius:15px;



    background:


    rgba(0,0,0,.35);



    border:


    1px solid rgba(255,255,255,.10);



    line-height:1.6;



    min-height:40px;



}






.status-ok{


    color:#00ff9d;


}




.obs{


    margin-top:20px;


    padding:15px;


    border-radius:12px;



    background:


    rgba(0,150,255,.08);



    border-left:


    3px solid #00eaff;



    font-size:14px;



}






.logo{


    margin-top:25px;


    text-align:center;


    color:#777;


    font-size:13px;


    letter-spacing:1px;


}


/* =========================
   LAYOUT PRINCIPAL
========================= */


.layout{


    display:flex;


    gap:35px;


    align-items:center;


    justify-content:center;


    width:95%;


    max-width:1100px;


}




/* =========================
   PREVIEW
========================= */


.preview{


    width:560px;


    height:260px;



    padding:25px;



    border-radius:25px;



    background:


    linear-gradient(
        145deg,
        rgba(25,35,60,.95),
        rgba(5,8,18,.96)
    );



    border:


    1px solid rgba(0,234,255,.25);



    box-shadow:


    0 0 35px rgba(0,110,255,.45);



}



.preview h2{


    text-align:center;


    margin-top:0;


    font-size:22px;


    color:#00eaff;


}




#previewFrame{


    width:560px;

    height:150px;


    border:0;


    background:transparent;


    transform:scale(.75);


    transform-origin:center;


}




/* =========================
   RESPONSIVO CELULAR
========================= */


@media(max-width:900px){


    body{

        height:auto;

        padding:25px 0;

    }



    .layout{


        flex-direction:column;


        width:95%;


    }



    .box{


        width:100%;


        max-width:430px;


    }




    .preview{


        width:560px;


        height:220px;


        padding:25px;


        border-radius:25px;


        display:flex;


        flex-direction:column;


        align-items:center;


        justify-content:center;


        overflow:hidden;


    }
}


</style>


</head>



<body>


<div class="layout">


<div class="box">



<h2>
🔥 Like Counter Live
</h2>



<div class="subtitulo">

YouTube Live Premium Overlay

</div>




<input

id="link"

placeholder="Cole o link da live do YouTube"

/>




<button onclick="iniciar()">

🚀 Iniciar Contador

</button>




<div id="status">

Aguardando live...

</div>




<div class="obs">


<b>📺 Como usar no OBS:</b>

<br><br>


1️⃣ Inicie a live pelo botão acima

<br>

2️⃣ Copie a URL do Overlay gerada

<br>

3️⃣ No OBS: Fontes → + → Navegador

<br>

4️⃣ Cole a URL

<br>

5️⃣ Use: 560 x 150 Pixels

<br>



</div>




<div class="logo">

BREEZA FF • Like Counter

</div>



</div>



<div class="preview">


<h2>
👁️ Preview Overlay
</h2>


<iframe
id="previewFrame"
src="overlay.html">
</iframe>


</div>


</div>


<script src="painel.js"></script>



</body>


</html>
