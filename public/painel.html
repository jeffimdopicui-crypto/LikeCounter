<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Painel Like Counter</title>


<style>


*{
    box-sizing:border-box;
}



body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:25px;

    overflow-y:auto;

    background:
    radial-gradient(
        circle at top,
        #16294d,
        #05070c 65%
    );

    font-family:Arial,sans-serif;

    color:white;

}




.box{

    width:100%;

    padding:35px;

    border-radius:25px;

    background:

    linear-gradient(
        145deg,
        rgba(25,35,60,.95),
        rgba(5,8,18,.96)
    );

    border:
    1px solid rgba(0,234,255,.25);

    box-shadow:

    0 0 35px rgba(0,110,255,.45),

    inset 0 0 35px rgba(255,255,255,.04);

    backdrop-filter:blur(15px);

    position:relative;

    overflow:hidden;

}





/* luz passando no card */


.box::before{


    content:"";


    position:absolute;


    top:0;


    left:-100%;


    width:70%;


    height:100%;



    background:


    linear-gradient(

        120deg,

        transparent,

        rgba(255,255,255,.15),

        transparent

    );



    animation:


    brilho 5s infinite;



}




@keyframes brilho{


    0%{

        left:-100%;

    }


    50%{

        left:130%;

    }


    100%{

        left:130%;

    }


}





h2{


    text-align:center;


    margin:0;



    font-size:28px;


    letter-spacing:2px;



    text-shadow:


    0 0 15px #00eaff;



}



.subtitulo{


    text-align:center;


    color:#aaa;


    margin-top:8px;


    margin-bottom:25px;


}





input{


    width:100%;


    padding:15px;


    margin-top:15px;



    background:


    rgba(0,0,0,.45);



    border:


    1px solid rgba(255,255,255,.15);



    border-radius:12px;



    color:white;



    font-size:16px;



    outline:none;



}



input::placeholder{

    color:#777;

}



input:focus{


    border-color:#00eaff;



    box-shadow:


    0 0 15px rgba(0,234,255,.4);


}







button{


    width:100%;



    margin-top:18px;



    padding:15px;



    border-radius:12px;



    border:0;



    cursor:pointer;



    color:white;



    font-size:17px;



    font-weight:bold;



    background:


    linear-gradient(

        90deg,

        #006eff,

        #00eaff

    );



    box-shadow:


    0 0 20px rgba(0,234,255,.5);



    transition:.3s;



}



button:hover{


    transform:scale(1.03);



    box-shadow:


    0 0 35px #00eaff;



}







#status{


    margin-top:25px;



    padding:18px;



    border-radius:15px;



    background:


    rgba(0,0,0,.35);



    border:


    1px solid rgba(255,255,255,.10);



    line-height:1.6;



    min-height:40px;



}






.status-ok{


    color:#00ff9d;


}




.obs{


    margin-top:20px;


    padding:15px;


    border-radius:12px;



    background:


    rgba(0,150,255,.08);



    border-left:


    3px solid #00eaff;



    font-size:14px;



}






.logo{


    margin-top:25px;


    text-align:center;


    color:#777;


    font-size:13px;


    letter-spacing:1px;


}


/* =========================
   LAYOUT PRINCIPAL
========================= */

.layout{

    display:grid;

    grid-template-columns:
    minmax(450px, 1fr)
    minmax(600px, 1.5fr);

    grid-template-areas:

    "painel preview"

    "painel editor";

    gap:35px;

    width:95vw;

    max-width:1900px;

    margin:auto;

    align-items:start;

}


/* =========================
   PREVIEW
========================= */


.preview{

    width:100%;

    min-height:260px;

    padding:25px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        rgba(25,35,60,.95),
        rgba(5,8,18,.96)
    );

    border:
    1px solid rgba(0,234,255,.25);

    box-shadow:
    0 0 35px rgba(0,110,255,.45);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}



.preview h2{


    text-align:center;


    margin-top:0;


    font-size:22px;


    color:#00eaff;


}




#previewFrame{

    width:560px;

    height:150px;

    border:0;

    background:transparent;

    transform:scale(.75);

    transform-origin:center;

}


/* =========================
   EDITOR GRID 4 COLUNAS
========================= */

.editor-grid{

    display:grid;

    grid-template-columns:repeat(4, minmax(160px,1fr));

    gap:18px 20px;

    margin-top:20px;

}



/* cada bloco */

.editor-item{

    display:flex;

    flex-direction:column;

}



/* texto dos controles */

.editor-item label{

    margin-bottom:8px;

    font-size:14px;

    color:#ddd;

}



/* seletores */

.editor-item input,
.editor-item select{

    width:100%;

}



/* arquivos ocupam espaço melhor */

.editor-item input[type="file"]{

    padding:10px;

    font-size:12px;

}



/* sliders */

.editor-item input[type="range"]{

    margin-top:15px;

}


/* =========================
   RESPONSIVO EDITOR
========================= */


/* Notebook / telas médias */

@media(max-width:1200px){

    .editor-grid{

        grid-template-columns:repeat(2, 1fr);

    }

}



/* Celular */

@media(max-width:600px){

    .editor-grid{

        grid-template-columns:1fr;

    }

}




/* =========================
   RESPONSIVO LAYOUT
========================= */


/* Tablet / telas menores */

@media(max-width:1000px){

    .layout{

        grid-template-columns:1fr;

        grid-template-areas:

        "painel"

        "preview"

        "editor";

        width:100%;

        padding:0;

    }


    .box,
    .preview,
    .editor-box{

        width:100%;

        max-width:none;

    }


    .preview{

        min-height:240px;

    }

}



/* Celular */

@media(max-width:600px){

    body{

        padding:15px;

    }


    .layout{

        gap:20px;

    }


    .box,
    .editor-box{

        padding:20px;

    }


    .preview{

        min-height:220px;

        padding:15px;

    }


    #previewFrame{

        transform:scale(.6);

    }

}

</style>


</head>



<body>


<div class="layout">


<div class="box" style="grid-area:painel;">



<h2>
🔥 Like Counter Live
</h2>



<div class="subtitulo">

YouTube Live Premium Overlay

</div>




<input

id="link"

placeholder="Cole o link da live do YouTube"

/>




<button onclick="iniciar()">

🚀 Iniciar Contador

</button>

<div id="status">

Aguardando live...

</div>




<div class="obs">


<b>📺 Como usar no OBS:</b>

<br><br>


1️⃣ Inicie a live pelo botão acima

<br>

2️⃣ Copie a URL do Overlay gerada

<br>

3️⃣ No OBS: Fontes → + → Navegador

<br>

4️⃣ Cole a URL

<br>

5️⃣ Use: 560 x 150 Pixels

<br>



</div>




<div class="logo">

BREEZA FF • Like Counter

</div>


</div>
<!-- FECHA BOX LIKE COUNTER -->

<div class="preview" style="grid-area:preview;">


<h2>
👁️ Preview Overlay
</h2>


<iframe
id="previewFrame"
src="overlay.html">
</iframe>


</div>
<!-- FECHA BOX Preview -->

<!-- =========================
     EDITOR DE OVERLAY
========================= -->


<div class="box editor-box" style="grid-area:editor;">

<div class="editor">


<h3>
⚙ Personalização
</h3>



<div class="editor-grid">



<!-- LIKE TEXTO -->

<div class="editor-item">

<label>
🎨 Cor do Texto LIKE
</label>

<input
type="color"
id="likeColor"
value="#00d8ff"
>

</div>



<div class="editor-item">

<label>
✨ Neon Texto LIKE
</label>

<input
type="color"
id="likeTextGlow"
value="#00eaff"
>

</div>





<!-- LIKE PNG -->

<div class="editor-item">

<label>
✨ Neon LIKE PNG Cor 1
</label>

<input
type="color"
id="likeGlow1"
value="#00d8ff"
>

</div>



<div class="editor-item">

<label>
✨ Neon LIKE PNG Cor 2
</label>

<input
type="color"
id="likeGlow2"
value="#008cff"
>

</div>





<!-- BARRA -->

<div class="editor-item">

<label>
🌈 Cor da Barra
</label>

<input
type="color"
id="barraColor"
value="#00eaff"
>

</div>



<div class="editor-item">

<label>
✨ Neon Barra
</label>

<input
type="color"
id="barraGlow"
value="#00eaff"
>

</div>





<!-- PERFIL -->

<div class="editor-item">

<label>
🌈 Borda Perfil
</label>

<input
type="color"
id="bordaColor"
value="#00eaff"
>

</div>



<div class="editor-item">

<label>
🎨 Fundo Card
</label>

<input
type="color"
id="fundoCard"
value="#12151f"
>

</div>





<!-- AVATAR NEON -->

<div class="editor-item">

<label>
✨ Neon Perfil Cor 1
</label>

<input
type="color"
id="avatarGlow1"
value="#00eaff"
>

</div>



<div class="editor-item">

<label>
✨ Neon Perfil Cor 2
</label>

<input
type="color"
id="avatarGlow2"
value="#006eff"
>

</div>





<!-- CARD NEON -->

<div class="editor-item">

<label>
✨ Neon Borda Card Cor 1
</label>

<input
type="color"
id="cardGlow1"
value="#006eff"
>

</div>



<div class="editor-item">

<label>
✨ Neon Borda Card Cor 2
</label>

<input
type="color"
id="cardGlow2"
value="#0026ff"
>

</div>





<!-- IMAGENS -->

<div class="editor-item">

<label>
🖼️ Imagem do LIKE
</label>

<input
type="file"
id="likeImg"
accept="image/png,image/jpeg"
>

</div>



<div class="editor-item">

<label>
🖼️ Imagem do Avatar
</label>

<input
type="file"
id="avatarImg"
accept="image/png,image/jpeg"
>

</div>





<!-- TAMANHOS -->

<div class="editor-item">

<label>
📏 Tamanho Avatar
</label>

<input
type="range"
id="avatarSize"
min="40"
max="150"
value="85"
>

</div>



<div class="editor-item">

<label>
📏 Tamanho Like
</label>

<input
type="range"
id="likeSize"
min="30"
max="120"
value="75"
>

</div>



</div>




<button onclick="salvarConfig()">

💾 Salvar

</button>



<button onclick="restaurarConfig()">

🔄 Restaurar

</button>



</div>


</div>
<!-- fecha editor -->


</div>
<!-- fecha box editor -->



</div>


<script src="painel.js"></script>



</body>


</html>
